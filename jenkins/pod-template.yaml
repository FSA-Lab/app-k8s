apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  containers:
    - name: node
      image: node:24-slim
      command: ['cat']
      tty: true
    - name: docker
      image: moby/buildkit:v0.29.0-rootless
      securityContext:
        privileged: true
      command: ['sh', '-c', 'buildkitd --addr unix:///run/buildkit/buildkitd.sock']
      volumeMounts:
        - name: buildkit-socket
          mountPath: /run/buildkit
    - name: kustomize
      image: kustomize/kustomize:v5.6.0
      command: ['cat']
      tty: true
  volumes:
    - name: buildkit-socket
      emptyDir: {}
