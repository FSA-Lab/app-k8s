apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  containers:
    - name: node
      image: node:24-slim
      command: ['cat']
      tty: true
    - name: docker
      image: docker:24-dind
      securityContext:
        privileged: true
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
    - name: kustomize
      image: kustomize/kustomize:latest
      command: ['cat']
      tty: true
  volumes:
    - name: docker-socket
      hostPath:
        path: /var/run/docker.sock
